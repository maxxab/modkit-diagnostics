[build-system]
requires = ["hatchling>=1.33,<2"]
build-backend = "hatchling.build"

[project]
name = "modkit-diagnostics"
version = "0.1.0"
description = "App-owned error catalogs, scoped diagnostics and explicit safe structured logging"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "maxxab"}]
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
python_version = "3.12"
strict = true
[tool.hatch.build.targets.wheel]
packages = ["src/modkit_diagnostics"]
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/examples", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml", "/requirements-dev.txt"]
