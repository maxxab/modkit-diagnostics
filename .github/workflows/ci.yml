name: Package tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate event commits and deterministic changelog
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          if [ "$EVENT_NAME" = pull_request ]; then
            BASE=$(git merge-base "$PR_BASE" "$HEAD")
            python .development-standards/standards.py validate-range "$BASE" "$HEAD"
          elif [ "$EVENT_NAME" = push ]; then
            if [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
              # An initial push has no base commit: include every root and descendant.
              MESSAGE=$(mktemp)
              trap 'rm -f "$MESSAGE"' EXIT
              for COMMIT in $(git rev-list --reverse --topo-order "$HEAD"); do
                git show -s --format=%B "$COMMIT" > "$MESSAGE"
                python .development-standards/standards.py validate-message "$MESSAGE"
              done
            else
              python .development-standards/standards.py validate-range "$BEFORE" "$HEAD"
            fi
          else
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 1
          fi
          python .development-standards/standards.py changelog --check
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: ruff check src tests scripts examples
      - run: mypy src scripts examples
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_wheel.py dist/modkit_diagnostics-0.1.0-py3-none-any.whl
      - name: Rebuild from sdist
        shell: python
        run: |
          import pathlib, subprocess, sys, tarfile, tempfile
          archive = pathlib.Path('dist/modkit_diagnostics-0.1.0.tar.gz').resolve()
          with tempfile.TemporaryDirectory() as temp:
              with tarfile.open(archive) as source:
                  source.extractall(temp, filter='data')
              root = pathlib.Path(temp) / 'modkit_diagnostics-0.1.0'
              subprocess.run([sys.executable, '-m', 'build', '--wheel', str(root)], check=True)
              wheel = root / 'dist/modkit_diagnostics-0.1.0-py3-none-any.whl'
              subprocess.run([sys.executable, '-m', 'twine', 'check', str(wheel)], check=True)
              subprocess.run([sys.executable, str(root / 'scripts/check_wheel.py'), str(wheel)], check=True)
